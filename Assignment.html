<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
      <style>
        body{
            background-color: white;
            display: flex;
            gap: 20px;
        }
        *{
            margin: 30px;
            padding: 0;
            box-sizing: border-box;
        }
        div {
            text-align: center;
            background-color: rgb(255, 136, 0);
            border-radius: 30px;

          }
          img{
            display: flex;
            justify-content: center;
            object-fit: cover;
          }

        .oNe {
            padding: 50px;
            margin: 300px;
            object-fit: cover;
        }
        .tWo {
            padding: 100px;
            margin: 10px;
            object-fit: cover;
        }
        .thRee {
            padding: 150px;
            margin: 50px;
            object-fit: cover;
        }

        button {
         
          color: white;
          background-color: black;
          padding: 8px;
          margin-top: -30px;
          width: 200px;
          border-radius: 20px;
          border-color: transparent;
        }
    </style>
</head>






<body>
    <div class="one"> 
      <img width="430px" src="Image/WhatsApp PHONE2026-10-05 at 01.26.03.jpeg" alt="">
     <h1>Product One</h1>
     <p>Galaxy Z Fold7 & Z Flip7 £1,899 £1,149</p>
     <button>Buy Now</button>
    </div>

    <div class="two">
      <img style="height: 380px;" width="430px" src="Image/WhatsApp WATCH2026-10-05 at 01.26.02.jpeg" alt="">
      <h1>Product Two</h1>
      <p>Samsung Galaxy Watch Ultra £288</p>
      <button>Buy Now</button>
    </div>

    <div class="three">
      <img style="height: 380px;" src="Image/WhatsApp LAPTOP2026-10-05 at 01.26.03.jpeg" alt="">
      <h1>Product Three</h1>
      <p>SAMSUNG Galaxy Book4 360 £641.97</p>
      <button>Buy Now</button>
    </div>

    
</body>
</html>
